<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a0d48">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RetroCast">
<meta name="format-detection" content="telephone=no">
<title>RetroCast</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<script>
  /* Detect iPhone home-screen mode before first paint so the header is never drawn under the status bar. */
  (function () {
    var ios = /iPhone|iPod/.test(navigator.userAgent);
    var sa = navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
    if (ios) document.documentElement.classList.add('ios');
    if (ios && sa) document.documentElement.classList.add('ios-standalone');
  })();
</script>
</head>
<body>
<div id="app">
  <div id="island-fill"></div>
  <div id="viewport">
    <div id="stage">
      <div id="hdr">
        <div id="logo"><div class="lg1">WX</div><div class="lg2">RETRO</div><div class="lg3">CAST</div></div>
        <div id="title" class="s"><div id="t1"></div><div id="t2"></div></div>
        <div id="clock" class="s"><div id="time">--:--</div><div id="date"></div></div>
      </div>
      <div id="page"></div>
      <div id="dots"></div>
      <div id="bottom">
        <div id="cond" class="s"></div>
        <div id="crawl"><div id="crawl-text" class="s"></div></div>
      </div>
      <div id="scan"></div>
      <div id="flash"></div>
    </div>
  </div>

  <div id="controls" class="hidden">
    <button data-act="prev" aria-label="Previous"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><rect x="4" y="5" width="3" height="14"/><path d="M20 5v14L8 12z"/></svg></button>
    <button data-act="pause" id="btn-pause" aria-label="Pause"></button>
    <button data-act="next" aria-label="Next"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><rect x="17" y="5" width="3" height="14"/><path d="M4 5v14l12-7z"/></svg></button>
    <button data-act="music" id="btn-music" aria-label="Music"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M9 4v11.2A3.5 3.5 0 1 0 11 18V8h7V4z"/></svg></button>
    <button data-act="loc" aria-label="Change location"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></button>
    <button data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1L11 21h4l.4-2.9a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></button>
  </div>

  <div id="setup" class="modal">
    <div class="panel retro">
      <div class="ptitle s">ENTER YOUR LOCATION</div>
      <p class="s small">City, "City, ST", or a 5-digit ZIP code</p>
      <form id="loc-form" autocomplete="off">
        <input id="loc-input" type="text" placeholder="Chicago, IL or 60601" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="search">
        <button type="submit" class="rbtn">GO</button>
      </form>
      <div id="loc-results"></div>
      <div class="row">
        <button id="geo-btn" class="rbtn alt">USE MY LOCATION</button>
        <button id="demo-btn" class="rbtn alt">TRY DEMO</button>
        <button id="setup-cancel" class="rbtn alt hidden">CANCEL</button>
      </div>
      <div id="loc-msg" class="s small"></div>
      <div id="a2hs" class="small s hidden">For full screen: tap <b>Share</b> → <b>Add to Home Screen</b>, then open RetroCast from your Home Screen.</div>
    </div>
  </div>

  <div id="settings" class="modal hidden">
    <div class="panel retro">
      <div class="ptitle s">SETTINGS</div>
      <div class="grid">
        <label>Temperature<select id="set-units"><option value="F">°F / mph</option><option value="C">°C / km/h</option></select></label>
        <label>Mode<select id="set-mode"><option value="loop">Continuous loop</option><option value="eights">Local on the 8s (:08, :18…)</option></select></label>
        <label>Page speed<select id="set-speed"><option value="1.35">Relaxed</option><option value="1">Classic</option><option value="0.7">Quick</option></select></label>
        <label>Music<select id="set-music"><option value="1">Smooth jazz ON</option><option value="0">Off</option></select></label>
        <label>Volume<input id="set-vol" type="range" min="0" max="1" step="0.05"></label>
        <label>Narrator<select id="set-voice"><option value="0">Off</option><option value="1">On</option></select></label>
        <label>CRT scanlines<select id="set-crt"><option value="1">On</option><option value="0">Off</option></select></label>
        <label>Alert tone<select id="set-beep"><option value="1">On for new warnings</option><option value="0">Off</option></select></label>
        <label>Test red ticker<select id="set-testalert"><option value="0">Off</option><option value="1">Show a test warning</option></select></label>
      </div>
      <div class="ptitle2 s">PAGES IN THE SEGMENT</div>
      <div id="set-pages" class="pages"></div>
      <div class="row">
        <button id="set-refresh" class="rbtn alt">REFRESH</button>
        <button id="set-loc" class="rbtn alt">LOCATION</button>
        <button id="set-close" class="rbtn">DONE</button>
      </div>
      <div id="credits" class="small s"></div>
    </div>
  </div>
</div>

<script src="js/cities.js"></script>
<script src="js/icons.js"></script>
<script src="js/music.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
